name: CI

on:
  push:
    branches: [ master, 'feat/**' ]
    tags: [ 'v*' ]
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Test font scanner on host
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O2 \
            tests/font_scan_test.cpp module/src/main/cpp/font_scan.cpp \
            -o /tmp/font_scan_test
          /tmp/font_scan_test

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Android module
        run: ./gradlew --no-daemon build

      - name: Verify installable ZIP
        run: |
          test -f out/font-loader-1.2.0-beta2-release.zip
          unzip -t out/font-loader-1.2.0-beta2-release.zip
          unzip -l out/font-loader-1.2.0-beta2-release.zip | grep -F 'module.prop'
          unzip -l out/font-loader-1.2.0-beta2-release.zip | grep -F 'lib/arm64-v8a/libfontloader.so'

      - name: Simulate installation (Magisk and KernelSU)
        run: sh tests/install_smoke.sh out/font-loader-1.2.0-beta2-release.zip

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: FontLoader-release
          path: out/*-release.zip
          if-no-files-found: error

      - name: Upload debug
        uses: actions/upload-artifact@v4
        with:
          name: FontLoader-debug
          path: out/*-debug.zip
          if-no-files-found: error
