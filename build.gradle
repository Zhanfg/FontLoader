// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply plugin: 'idea'

idea.module {
    excludeDirs += file('out')
    resourceDirs += file('template')
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    moduleId = 'font-loader'
    moduleName = 'Font Loader (Boot Guard)'
    moduleDescription = 'Boot-safe opt-in font preload. No automatic preloading.'
    moduleAuthor = 'JingMatrix, Rikka'
    moduleVersionName = '1.2.0-bootguard-preview1'
    moduleVersionCode = 6
}
